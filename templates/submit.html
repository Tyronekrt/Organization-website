<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
        }

        .form-section h2 {
            text-align: center;
            color: #333;
        }

        .underline {
            width: 60px;
            height: 4px;
            background-color: #6b376b;
            margin: 10px auto 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #6b376b;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 18px;
            transition: background 0.3s ease;
        }

        button:hover {
            background-color: #542c54;
        }

        .image-section {
            flex: 1;
            min-width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: #ddd;
            padding: 20px;
        }

        .image-section img {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            object-fit: cover;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .image-section img {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-section">
            <h2>Get in Touch</h2>
            <div class="underline"></div>
            <form>
                <div class="input-group">
                    <input type="text" placeholder="First Name" required>
                    <input type="text" placeholder="Last Name">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>
                    <input type="tel" placeholder="Mobile Number" required>
                </div>
                <textarea rows="4" placeholder="Message"></textarea>
                <button type="submit">Submit Form</button>
            </form>
        </div>
        <div class="image-section">
            <!-- Replace 'your-image.jpg' with your actual image URL or file path -->
            <img src="your-image.jpg" alt="Contact Image">
        </div>
    </div>
</body>
</html>

{% extends 'starter-page.html' %}
{% block body %}
    {% load static %}

    <!-- Teams Section -->
    <section id="team" class="team section light-background">

        <!-- Section Title -->
        <div class="container section-title" data-aos="fade-up">
            <h2>Team</h2>
            <p>CHECK OUR TEAM</p>
        </div><!-- End Section Title -->

        <div class="container">
            <div id="teamCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
                <div class="carousel-inner">
                    {% for member in members %}
                    <div class="carousel-item {% if forloop.first %}active{% endif %} transition-effect">
                        <div class="row gy-5 justify-content-center">
                            <div class="col-lg-4 col-md-6" data-aos="fade-up" data-aos-delay="100">
                                <div class="member">
                                    <div class="pic" style="height: 550px; overflow: hidden;">
                                        <img src="{{ member.memberimage.url }}" class="img-fluid w-100 h-100 animated-image" style="object-fit: cover;" alt="">
                                    </div>
                                    <div class="member-info">
                                        <h4>{{ member.membername }}</h4>
                                        <span>{{ member.position }}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- Carousel Controls -->
                <button class="carousel-control-prev" type="button" data-bs-target="#teamCarousel" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#teamCarousel" data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Add Bootstrap CSS and JS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom CSS for Animation -->
    <style>
        .transition-effect {
            transition: transform 0.8s ease;
        }

        .animated-image {
            transition: transform 0.8s ease;
        }

        .carousel-item img:hover {
            transform: scale(1.05);
        }
    </style>
{% endblock %}

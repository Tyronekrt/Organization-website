{% extends 'starter-page.html' %}
{% block body %}
    {% load static %}

   <section>
                <h2 class="text-center">EVENTS</h2>
                    <table class="table table-info container">
                        <tr>
                            <th>image</th>
                            <th>action</th>
                        </tr>

                        {% for x in events %}
                            <tr>
                                <td>{{ x.name }}</td>
                                <td>{{ x.image }}</td>
                                <td>{{ x.Action }}</td>
                                <td>
                                    <a href="/editappointment/{{ x.id }}" class="btn btn-warning">EDIT</a>
                                    <a href="/deleteappointment/{{ x.id }}" class="btn btn-danger">DELETE</a>
                                </td>
                            </tr>
                        {% endfor %}
                    </table>

            </section>
{% endblock %}

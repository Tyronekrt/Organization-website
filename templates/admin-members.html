{% extends 'starter-page.html' %}
{% block body %}
    {% load static %}

   <section>
                <h2 class="text-center">TEAM MEMBERS</h2>
                    <table class="table table-info container">
                        <tr>
                            <th>Name</th>
                            <th>position</th>
                            <th>image</th>
                            <th>action</th>
                        </tr>

                        {% for x in members %}
                            <tr>
                                <td>{{ x.name }}</td>
                                <td>{{ x.position }}</td>
                                <td>{{ x.image }}</td>
                                <td>{{ x.Action }}</td>
                                <td>
                                    <a href="/editmembers/{{ x.id }}" class="btn btn-warning">EDIT</a>
                                    <a href="/deletemembers/{{ x.id }}" class="btn btn-danger">DELETE</a>
                                </td>
                            </tr>
                        {% endfor %}
                    </table>

            </section>
{% endblock %}
